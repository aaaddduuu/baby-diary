<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">成长曲线示意图</title>
  <desc id="desc">成长页面展示体重、身高和头围曲线，并与 WHO 参考范围对比。</desc>
  <rect width="1200" height="720" rx="32" fill="#F1FAF6"/>
  <text x="86" y="92" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="800" fill="#21382E">成长曲线：用数据看见每一次长大</text>
  <text x="86" y="144" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#5F7368">体重、身高、头围分维度记录，并对照 WHO 参考范围观察趋势。</text>
  <g transform="translate(90 210)">
    <rect width="1020" height="360" rx="30" fill="#FFFFFF"/>
    <g transform="translate(58 48)">
      <rect width="120" height="48" rx="24" fill="#EAF8F2"/><text x="60" y="31" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#1A5C3A">体重</text>
      <rect x="140" width="120" height="48" rx="24" fill="#F6F3EA"/><text x="200" y="31" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#5F7368">身高</text>
      <rect x="280" width="120" height="48" rx="24" fill="#F6F3EA"/><text x="340" y="31" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#5F7368">头围</text>
    </g>
    <g transform="translate(86 142)">
      <line x1="0" y1="180" x2="840" y2="180" stroke="#D7E6DD" stroke-width="2"/>
      <line x1="0" y1="120" x2="840" y2="120" stroke="#D7E6DD" stroke-width="2"/>
      <line x1="0" y1="60" x2="840" y2="60" stroke="#D7E6DD" stroke-width="2"/>
      <path d="M0 154 C120 128, 210 118, 320 96 C450 72, 560 64, 700 42 C760 34, 806 28, 840 24" fill="none" stroke="#BEE7D4" stroke-width="14" stroke-linecap="round"/>
      <path d="M0 170 C120 152, 240 132, 350 112 C470 90, 590 75, 720 58 C780 50, 820 44, 840 40" fill="none" stroke="#4AB89A" stroke-width="6" stroke-linecap="round"/>
      <circle cx="88" cy="156" r="10" fill="#1A5C3A"/><circle cx="218" cy="132" r="10" fill="#1A5C3A"/><circle cx="388" cy="104" r="10" fill="#1A5C3A"/><circle cx="604" cy="72" r="10" fill="#1A5C3A"/>
      <text x="0" y="222" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7A8B80">0月</text>
      <text x="388" y="222" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7A8B80">3月</text>
      <text x="806" y="222" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7A8B80">6月</text>
    </g>
    <g transform="translate(720 42)">
      <rect width="236" height="86" rx="22" fill="#F8F7EF"/>
      <text x="24" y="34" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5F7368">最近一次体重</text>
      <text x="24" y="68" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="800" fill="#1A5C3A">6.8kg</text>
    </g>
  </g>
</svg>
