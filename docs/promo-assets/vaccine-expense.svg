<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">疫苗和账本示意图</title>
  <desc id="desc">左侧为疫苗计划与接种状态，右侧为家庭账本与支出统计。</desc>
  <rect width="1200" height="720" rx="32" fill="#F8F7EF"/>
  <text x="86" y="92" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="800" fill="#21382E">健康计划和家庭账本，都有据可查</text>
  <text x="86" y="144" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#5F7368">疫苗提醒负责健康节奏，账本统计负责支出脉络。</text>
  <g transform="translate(90 210)">
    <rect width="485" height="390" rx="30" fill="#FFFFFF"/>
    <text x="34" y="52" font-size="32">💉</text>
    <text x="82" y="52" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#21382E">疫苗计划</text>
    <g transform="translate(34 96)">
      <rect width="130" height="78" rx="20" fill="#EAF8F2"/><text x="28" y="32" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#49735D">已完成</text><text x="28" y="62" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#1A5C3A">12</text>
      <rect x="150" width="130" height="78" rx="20" fill="#FFF7E9"/><text x="178" y="32" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#9D6A1A">待接种</text><text x="178" y="62" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#9D6A1A">3</text>
      <rect x="300" width="116" height="78" rx="20" fill="#EDF7FF"/><text x="328" y="32" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#3070A8">完成率</text><text x="328" y="62" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#3070A8">80%</text>
    </g>
    <g transform="translate(34 218)">
      <circle cx="16" cy="16" r="13" fill="#5BC4A0"/><text x="48" y="22" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#21382E">乙肝疫苗 第3针</text>
      <text x="314" y="22" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5F7368">已完成</text>
      <circle cx="16" cy="76" r="13" fill="#E7C178"/><text x="48" y="82" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#21382E">A群流脑疫苗</text>
      <text x="314" y="82" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#9D6A1A">7天后</text>
    </g>
  </g>
  <g transform="translate(625 210)">
    <rect width="485" height="390" rx="30" fill="#FFFFFF"/>
    <text x="34" y="52" font-size="32">💰</text>
    <text x="82" y="52" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#21382E">宝宝账本</text>
    <g transform="translate(44 104)">
      <circle cx="110" cy="110" r="86" fill="none" stroke="#EAF8F2" stroke-width="32"/>
      <path d="M110 24 A86 86 0 0 1 195 124" fill="none" stroke="#5A9ED4" stroke-width="32" stroke-linecap="round"/>
      <path d="M195 124 A86 86 0 0 1 92 194" fill="none" stroke="#E8A030" stroke-width="32" stroke-linecap="round"/>
      <text x="110" y="106" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#21382E">¥1286</text>
      <text x="110" y="136" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#7A8B80">本月</text>
    </g>
    <g transform="translate(286 116)">
      <rect width="146" height="28" rx="14" fill="#EDF7FF"/><text x="18" y="20" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#3070A8">奶粉 42%</text>
      <rect y="50" width="146" height="28" rx="14" fill="#FFF7E9"/><text x="18" y="70" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#9D6A1A">纸尿裤 31%</text>
      <rect y="100" width="146" height="28" rx="14" fill="#F0ECFB"/><text x="18" y="120" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#6A50A0">衣物 16%</text>
    </g>
    <g transform="translate(44 312)">
      <rect width="390" height="36" rx="18" fill="#F6F3EA"/>
      <rect width="74" height="36" rx="18" fill="#4AB89A"/>
      <rect x="96" width="58" height="36" rx="18" fill="#D4C9BC"/>
      <rect x="176" width="112" height="36" rx="18" fill="#4AB89A"/>
      <rect x="310" width="80" height="36" rx="18" fill="#D4C9BC"/>
    </g>
  </g>
</svg>
