<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">家庭协作示意图</title>
  <desc id="desc">展示家庭成员通过邀请码加入同一宝宝空间，并共同维护记录。</desc>
  <rect width="1200" height="720" rx="32" fill="#F3EEF9"/>
  <text x="86" y="92" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="800" fill="#21382E">家庭协作：不是一个人记，是一家人一起守护</text>
  <text x="86" y="144" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#5F7368">邀请码加入同一个家庭空间，记录保留成员身份，照护交接更清楚。</text>
  <g transform="translate(110 220)">
    <circle cx="150" cy="120" r="78" fill="#FFFFFF"/>
    <text x="150" y="112" text-anchor="middle" font-size="46">👩</text>
    <text x="150" y="164" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#21382E">妈妈</text>
    <circle cx="150" cy="300" r="78" fill="#FFFFFF"/>
    <text x="150" y="292" text-anchor="middle" font-size="46">👨</text>
    <text x="150" y="344" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#21382E">爸爸</text>
    <circle cx="820" cy="120" r="78" fill="#FFFFFF"/>
    <text x="820" y="112" text-anchor="middle" font-size="46">👵</text>
    <text x="820" y="164" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#21382E">奶奶</text>
    <circle cx="820" cy="300" r="78" fill="#FFFFFF"/>
    <text x="820" y="292" text-anchor="middle" font-size="46">🧑</text>
    <text x="820" y="344" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800" fill="#21382E">看护人</text>
    <g transform="translate(360 64)">
      <rect width="250" height="292" rx="38" fill="#21382E"/>
      <rect x="16" y="16" width="218" height="260" rx="28" fill="#FFFFFF"/>
      <text x="109" y="70" text-anchor="middle" font-size="48">👶</text>
      <text x="109" y="116" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#21382E">小橙子</text>
      <rect x="42" y="146" width="134" height="42" rx="21" fill="#EAF8F2"/>
      <text x="109" y="174" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#1A5C3A">邀请码 8K3M2</text>
      <text x="109" y="222" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#5F7368">同一份记录</text>
      <text x="109" y="250" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#5F7368">多人同步维护</text>
    </g>
    <path d="M220 130 C300 120, 330 116, 360 170" fill="none" stroke="#9B7EC8" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 300 C300 300, 330 286, 360 230" fill="none" stroke="#9B7EC8" stroke-width="8" stroke-linecap="round"/>
    <path d="M742 130 C670 120, 640 116, 610 170" fill="none" stroke="#9B7EC8" stroke-width="8" stroke-linecap="round"/>
    <path d="M742 300 C670 300, 640 286, 610 230" fill="none" stroke="#9B7EC8" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
