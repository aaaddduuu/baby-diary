<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">宝宝日记宣传封面</title>
  <desc id="desc">宝宝日记应用的宣传封面图，展示首页卡片、记录入口和家庭协作概念。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F3E8"/>
      <stop offset="0.48" stop-color="#EAF8F2"/>
      <stop offset="1" stop-color="#F3EEF9"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A5C3A"/>
      <stop offset="1" stop-color="#5BC4A0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#1A5C3A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1030" cy="150" r="86" fill="#FFE8C8" opacity="0.75"/>
  <circle cx="165" cy="600" r="110" fill="#D9F2E8" opacity="0.85"/>
  <g transform="translate(104 118)">
    <text x="0" y="0" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#2F6F55">Baby Diary</text>
    <text x="0" y="72" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="68" font-weight="800" fill="#21382E">宝宝日记</text>
    <text x="0" y="128" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#4F6F60">把喂养、睡眠、成长、疫苗和家庭协作</text>
    <text x="0" y="170" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#4F6F60">记录成一条清晰的宝宝成长线。</text>
    <g transform="translate(0 230)">
      <rect width="190" height="64" rx="32" fill="#21382E"/>
      <text x="95" y="40" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">开始记录</text>
      <rect x="214" width="230" height="64" rx="32" fill="#FFFFFF" stroke="#CFE6DA"/>
      <text x="329" y="40" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#2F6F55">家庭共享</text>
    </g>
  </g>
  <g transform="translate(690 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="590" rx="46" fill="#21382E"/>
    <rect x="18" y="18" width="294" height="554" rx="34" fill="#F8F7EF"/>
    <rect x="18" y="18" width="294" height="204" rx="34" fill="url(#phone)"/>
    <text x="44" y="72" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#EAF8F2">今日小日记</text>
    <text x="44" y="122" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">小橙子</text>
    <text x="44" y="158" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#D9F2E8">2个月8天 · 2026-03-30 出生</text>
    <g transform="translate(38 238)">
      <rect width="118" height="92" rx="24" fill="#FFFFFF"/>
      <text x="24" y="36" font-size="24">🍼</text>
      <text x="24" y="68" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#21382E">配方奶</text>
      <rect x="140" width="118" height="92" rx="24" fill="#FFFFFF"/>
      <text x="164" y="36" font-size="24">😴</text>
      <text x="164" y="68" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#21382E">睡眠</text>
    </g>
    <g transform="translate(38 352)">
      <rect width="258" height="74" rx="22" fill="#FFFFFF"/>
      <text x="24" y="32" font-size="22">📈</text>
      <text x="62" y="31" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="800" fill="#21382E">成长曲线</text>
      <text x="62" y="54" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7A8B80">身高体重头围趋势</text>
    </g>
    <g transform="translate(38 444)">
      <rect width="258" height="74" rx="22" fill="#FFFFFF"/>
      <text x="24" y="32" font-size="22">👨‍👩‍👧</text>
      <text x="70" y="31" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="800" fill="#21382E">家庭成员一起记</text>
      <text x="70" y="54" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#7A8B80">同一份记录，多人同步</text>
    </g>
  </g>
</svg>
